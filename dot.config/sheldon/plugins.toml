shell = "zsh"

[plugins.enhancd]
github = "b4b4r07/enhancd"
use = ["init.sh"]

[plugins.cd-gitroot]
github = "mollifier/cd-gitroot"
hooks.post = 'alias cgr="cd-gitroot"'

[plugins.anyframe]
github = "oppara/anyframe"
hooks.post = '''
zstyle ":anyframe:selector:" use fzf
bindkey "^s^s" anyframe-widget-insert-ssh-host
bindkey "^g^g" anyframe-widget-insert-git-branch
alias gco=anyframe-widget-checkout-git-branch
'''

[plugins.tmk]
github = "yuki-yano/tmk"

[plugins.ha]
github = "kawarimidoll/ha"
use = ["ha.sh"]
hooks.post = '''
compdef _ha ha
'''
